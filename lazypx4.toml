# lazypx4 settings.
#
# Looked up as: --config FILE, else ./lazypx4.toml, else this file in the
# repo lazypx4 was built from. Every key is optional; command-line flags
# override the file. Values below are the built-in defaults.

[link]
# port = 14560                      # UDP port PX4 sends MAVLink to
# record_tlog = false               # write every session to a .tlog (or run with --tlog)

[paths]
# tlog_dir = "./px4_tlogs"          # session telemetry (.tlog), see [link] record_tlog
# log_dir = "./px4_logs"            # downloaded .ulg flight logs
# param_dir = "./px4_params"        # [s] save / [l] load on the parameter screen
# param_defaults = "build/px4_sitl_default/parameters.json"
# map_dir = "./px4_maps"            # satellite snapshots
# firmware_dir = "./px4_firmware"   # .px4 files for [f]
# tools_dir = "./Tools"             # px_uploader.py / ecl_ekf
# disk_path = "/"                   # filesystem shown on the dashboard HOST line
# kml = "mission.kml"               # map overlay loaded at start-up

[record]
# The [e] RECORD pane. `R` starts every recorder set to true here.
# dir = "~/logs"                    # runs: <dir>/<date>_<time>[_name]/
# state_dir = "~/.tmux-recording"   # <state_dir>/<tmux session> = the active run dir
# tlog = true                       # mavlink/telemetry.tlog, from this link
# tmux = true                       # every pane of this tmux session
# tmux_skip_windows = []
# tmux_strip_ansi = false
# rosbag = true
# ros_setup = ""                    # sourced first, e.g. "~/ros2_ws/install/setup.bash"
# rosbag_topics = []                # non-empty = only these (the excludes are ignored)
# rosbag_exclude = [".*image_raw.*"] # DON'T RECORD CAMERAS - too much data can upset ROS
# rosbag_args = []                  # e.g. ["-s", "mcap", "--max-bag-duration", "600"]
# rosbag_stall_s = 30               # alert when the bag stops growing
# system = true                     # system.csv: host + vehicle, 1 Hz
# ping = []                         # e.g. ["drone=10.0.0.5", "gcs=10.0.0.2"]
# screen = false                    # [V] toggles it either way
# screen_window = ""                # follow a window by title, e.g. "QGroundControl"
# screen_fps = 5
# screen_cmd = ""                   # your own command; $OUT = file to write
# auto_markers = true               # arm / disarm / mode changes / alerts
# markers = ["takeoff", "mission start", "mission end", "landing", "anomaly", "good", "bad"]
# disk_low_gb = 5.0
#
# Any command worth keeping: output to <run>/<name>.log; `alert` is a regex.
# [[record.command]]
# name = "kernel"
# cmd = "dmesg -w --time-format iso"
# alert = "(?i)usb disconnect|i/o error"
#
# [[record.command]]
# name = "journal"
# cmd = "journalctl -f -o short-precise"
# enabled = false                   # listed, but not part of [R]

[upload]
# server = "https://v2.logs.px4.io" # Flight Review v2 server [u] uploads .ulg logs to

[ros]
# lidar_topic = "/livox/points"
# navpath_topic = "/navsat_utm_path"
# use_sim_time = false

[safety]
# allow_log_download_while_armed = false
# battery_low = 30.0                # % - yellow + warning
# battery_critical = 15.0           # % - red + failsafe event

[alerts]
# bell = true                       # ring the terminal bell (tmux flags the window) + play the sound
# sound = "beep"                    # built-in beep, a sound file path, or "" = terminal bell only
# repeat = 5                        # beeps (or plays of the file) per alert

[fleet]
# ports = [14560, 14561, 14562]     # what `lazypx4 --fleet` (no list) watches

# The KEY PARAMETERS panel on the parameter screen: heading = [names].
# Groups are laid out in two columns, in this order. Omit to keep the default.
# [key_params]
# FLIGHT = ["MIS_TAKEOFF_ALT", "RTL_RETURN_ALT", "MPC_XY_CRUISE", "MPC_XY_VEL_MAX"]
# FAILSAFE = ["GF_ACTION", "NAV_DLL_ACT", "NAV_RCL_ACT", "COM_LOW_BAT_ACT"]
# ESTIMATOR = ["EKF2_HGT_REF", "EKF2_GPS_CTRL", "EKF2_RNG_CTRL"]

# Key remaps: pressed key = key it acts as. "" disables a key. Names are
# single characters, or ESC ENTER TAB UP DOWN LEFT RIGHT PGUP PGDN HOME END
# CTRL_X. Never applied while typing (prompts, the NSH shell, search).
[keys]
# "K" = ""                          # no kill key - use :kill instead

# `:` command-line aliases. The first word is replaced and any arguments
# are appended (`:up 5` -> `:takeoff 5`). `!` runs a host command.
[aliases]
# up = "takeoff"
# agent = "!sudo systemctl restart micro-xrce-dds-agent"
# topics = "!ros2 topic list"
# top = "nsh top once"
